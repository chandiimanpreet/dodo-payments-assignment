services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invoices
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoices"]
      interval: 2s
      timeout: 3s
      retries: 20

  mockpsp:
    build: .
    command: ["mockpsp"]

  webhook-sink:
    build: .
    command: ["webhook-sink"]

  api:
    build: .
    command: ["api"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/invoices?sslmode=disable
      PSP_URL: http://mockpsp:8081
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy
      mockpsp:
        condition: service_started

  test:
    profiles: ["test"]
    build:
      context: .
      target: build
    command: ["go", "test", "-count=1", "-v", "./internal/app/"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/invoices?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
